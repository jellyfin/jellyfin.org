StylesPath = styles
MinAlertLevel = suggestion

# Pin the package so CI behavior does not change unexpectedly.
Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft

# Vale owns spelling for documentation. The vocabulary handles general project
# terms; Jellyfin.Terms owns canonical brand names while allowing command,
# package, and identifier forms in code contexts.
Vocab = Jellyfin
Vale.Spelling = NO
Vale.Terms = NO
Jellyfin.Spelling = error
Jellyfin.Terms = warning

# Useful, but not reliable enough to fail CI initially.
Vale.Repetition = warning

# Do not inherit every Microsoft opinion.
Microsoft = NO

# Objective or broadly applicable checks.
Microsoft.BiasFree = warning
Microsoft.DateFormat = warning
Microsoft.DateNumbers = warning
Microsoft.DateOrder = warning
Microsoft.Gender = warning
Microsoft.GenderBias = warning
Microsoft.Ordinal = warning
Microsoft.Spacing = error

# Editorial guidance for authors, not merge blockers.
Microsoft.Foreign = suggestion
Microsoft.UIVerbs = suggestion
Microsoft.Wordiness = suggestion
