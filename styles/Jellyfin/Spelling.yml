extends: spelling
message: "Did you really mean '%s'?"
level: error

# These terms have canonical capitalization enforced by terminology rules.
# Excluding them from spell-checking prevents both rules from reporting the
# same casing issue while leaving all other spelling checks enabled.
filters:
  - '(?i)^amd$'
  - '(?i)^anidb$'
  - '(?i)^anilist$'
  - '(?i)^android$'
  - '(?i)^apache$'
  - '(?i)^apple$'
  - '(?i)^archlinux$'
  - '(?i)^armbian$'
  - '(?i)^asahi$'
  - '(?i)^caddy$'
  - '(?i)^certbot$'
  - '(?i)^chrome$'
  - '(?i)^chromecast$'
  - '(?i)^cloudflare$'
  - '(?i)^debian$'
  - '(?i)^docker$'
  - '(?i)^docusaurus$'
  - "(?i)^ffmpeg(?:'s)?$"
  - '(?i)^firefox$'
  - '(?i)^freebsd$'
  - '(?i)^github$'
  - '(?i)^gitlab$'
  - '(?i)^google$'
  - '(?i)^haproxy$'
  - '(?i)^hdhomerun$'
  - '(?i)^intel$'
  - '(?i)^ios$'
  - '(?i)^jellyfin$'
  - '(?i)^jetbrains$'
  - '(?i)^kodi$'
  - '(?i)^kubernetes$'
  - '(?i)^letsencrypt$'
  - '(?i)^linuxserver$'
  - '(?i)^macos$'
  - '(?i)^microsoft$'
  - '(?i)^mopidy$'
  - '(?i)^nginx$'
  - '(?i)^nvidia$'
  - '(?i)^omdb$'
  - '(?i)^opensuse$'
  - '(?i)^plex$'
  - '(?i)^podman$'
  - '(?i)^powershell$'
  - '(?i)^proxmox$'
  - '(?i)^radeon$'
  - '(?i)^raspbian$'
  - '(?i)^rockchip$'
  - '(?i)^roku$'
  - '(?i)^rpmfusion$'
  - '(?i)^selinux$'
  - '(?i)^safari$'
  - '(?i)^shoutcast$'
  - '(?i)^swiftfin$'
  - '(?i)^synology$'
  - '(?i)^tailscale$'
  - '(?i)^tmdb$'
  - '(?i)^traefik$'
  - '(?i)^truenas$'
  - '(?i)^tvdb$'
  - '(?i)^tvheadend$'
  - '(?i)^tvos$'
  - '(?i)^ubuntu$'
  - '(?i)^videotoolbox$'
  - '(?i)^vue$'
  - '(?i)^vulkan$'
  - '(?i)^webos$'
  - '(?i)^webstorm$'
  - '(?i)^windows$'
  - '(?i)^wireguard$'
  - '(?i)^youtube$'
  # Vale tokenizes apostrophe-s with the word, so accept brand possessives too.
  - "(?i)^(?:amd|anidb|anilist|android|apache|apple|archlinux|armbian|asahi|caddy|certbot|chrome|chromecast|cloudflare|debian|docker|docusaurus|ffmpeg|firefox|freebsd|github|gitlab|google|haproxy|hdhomerun|intel|ios|jellyfin|jetbrains|kodi|kubernetes|letsencrypt|linuxserver|macos|microsoft|mopidy|nginx|nvidia|omdb|opensuse|plex|podman|powershell|proxmox|radeon|raspbian|rockchip|roku|rpmfusion|safari|selinux|shoutcast|swiftfin|synology|tailscale|tmdb|traefik|truenas|tvdb|tvheadend|tvos|ubuntu|videotoolbox|vue|vulkan|webos|webstorm|windows|wireguard|youtube)(?:['’]s)$"
