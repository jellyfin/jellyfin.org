extends: substitution
message: "Use '%s' instead of '%s' when referring to the product."
level: warning
ignorecase: true
nonword: true
scope: text & ~link
vocab: false
action:
  name: replace

# The spelling rule accepts command, package, and identifier forms such as
# `ffmpeg`, `jellyfin-ffmpeg`, and `FFMPEGDIR`. This rule separately enforces
# canonical brand names in prose. The boundaries exclude hyphenated package
# names and identifiers; Vale excludes inline and fenced code. Link text is
# excluded because labels often preserve lowercase repository or package names.
# Keep brand tokens out of the active vocabulary because vocabulary entries
# are global rule exceptions; add their tokens to Jellyfin.Spelling instead.
swap:
  '(?<![-\w])amd(?![-\w])': AMD
  '(?<![-\w])anidb(?![-\w])': AniDB
  '(?<![-\w])anilist(?![-\w])': AniList
  '(?<![-\w])android(?![-\w])': Android
  '(?<![-\w])apache(?![-\w])': Apache
  '(?<![-\w])apple(?![-\w])': Apple
  '(?<![-\w])arch[ -]?linux(?![-\w])': Arch Linux
  '(?<![-\w])armbian(?![-\w])': Armbian
  '(?<![-\w])asahi(?![-\w])': Asahi
  '(?<![-\w])caddy(?![-\w])': Caddy
  '(?<![-\w])certbot(?![-\w])': Certbot
  '(?<![-\w])chrome(?![-\w])': Chrome
  '(?<![-\w])chromecast(?![-\w])': Chromecast
  '(?<![-\w])cloudflare(?![-\w])': Cloudflare
